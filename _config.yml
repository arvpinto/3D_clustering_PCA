title: Clustering MD trajectories on their principal components
description: Cluster an MD trajectory on the first three principal components of a chosen selection with MDAnalysis, DBSCAN and Gaussian mixture models, then extract the most representative frames of each cluster.
author: Alexandre V. Pinto
lang: en
image: /assets/img/PCA_vectors.png

